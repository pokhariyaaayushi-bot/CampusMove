services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: campusmove-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: development
      HOST: 0.0.0.0
      PORT: 5000
      DB_TYPE: mysql
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DATABASE:-campusmove}
      MYSQL_USER: ${MYSQL_USER:-campus_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-campus_pass}
    ports:
      # 5001 avoids colliding with macOS Control Center, which commonly uses
      # host port 5000. Override with HOST_PORT if another port is preferred.
      - "${HOST_PORT:-5001}:5000"
    volumes:
      # Keep the source available while developing.
      - ./:/app
    command: ["python", "backend/run.py"]

  db:
    image: mysql:8.0
    container_name: campusmove-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campusmove}
      MYSQL_USER: ${MYSQL_USER:-campus_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-campus_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  # Preserve the project's existing MySQL volume when upgrading Compose.
  db_data:

